name: Update Doc Folder
run-name: Update Doc Folder (${{ github.event_name }})
on:
  workflow_dispatch:
  schedule:
    - cron: '31 12 * * 0'  # At 12:38UTC on Sunday
  push:
env:
  config-branch-name: dev-MC_25km_jra_iaf+wombatlite
  doc-files: 'config.yaml nuopc.runconfig nuopc.runseq MOM_input ice_in docs'
jobs:
  update-doc-folder:
    runs-on: ubuntu-latest 
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: doc
      - name: Import Commit-Signing Key
        uses: crazy-max/ghaction-import-gpg@01dd5d3ca463c7f10f7f4f7b4f177225ac661ee4  # v6.1.0
        with:
          gpg_private_key: ${{ secrets.GH_ACTIONS_BOT_GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GH_ACTIONS_BOT_GPG_PASSPHRASE }}
          git_config_global: true
          git_committer_name: ${{ vars.GH_ACTIONS_BOT_GIT_USER_NAME }}
          git_committer_email: ${{ vars.GH_ACTIONS_BOT_GIT_USER_EMAIL }}
          git_user_signingkey: true
          git_commit_gpgsign: true
          git_tag_gpgsign: true
      - name: update doc folder from config branch
        run: |
          git fetch origin ${{ env.config-branch-name }}
          commit=$(git rev-parse --short origin/${{ env.config-branch-name }})
          git checkout origin/${{ env.config-branch-name }} ${{ env.doc-files }}

          for file in ${{ env.doc-files }}
          do
              mv ${file} doc
              git add doc/${file}
              git restore --staged ${file}
              echo "updated ${file}"
          done

          git commit -m "Updated doc folder from branch https://github.com/ACCESS-NRI/access-om3-configs/tree/${{ env.config-branch-name }} commit: ${commit}"

          git push
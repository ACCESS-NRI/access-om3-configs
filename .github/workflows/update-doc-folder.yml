name: Update Doc Folder
run-name: Update Doc Folder (${{ github.event_name }})
on:
  workflow_dispatch:
  schedule:
    - cron: '31 12 * * 0'  # At 12:38UTC on Sunday
  push:
env:
  config-branch-name: dev-MC_25km_jra_iaf+wombatlite
  doc-files: 'config.yaml nuopc.runconfig nuopc.runseq MOM_input ice_in'
jobs:
  create_pr:
    runs-on: ubuntu-latest 
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
      - name: Import Commit-Signing Key
        uses: crazy-max/ghaction-import-gpg@01dd5d3ca463c7f10f7f4f7b4f177225ac661ee4  # v6.1.0
        with:
          gpg_private_key: ${{ secrets.GH_ACTIONS_BOT_GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GH_ACTIONS_BOT_GPG_PASSPHRASE }}
          git_config_global: true
          git_committer_name: ${{ vars.GH_ACTIONS_BOT_GIT_USER_NAME }}
          git_committer_email: ${{ vars.GH_ACTIONS_BOT_GIT_USER_EMAIL }}
          git_user_signingkey: true
          git_commit_gpgsign: true
          git_tag_gpgsign: true
      - name: update doc folder from config branch
        run: |
          git checkout ${{ env.config-branch-name }}
          git pull
          commit=$(git rev-parse --short HEAD)
          git checkout main
          git pull
          git checkout $config-branch-name ${files[*]}

          for file in ${{ env.doc-files }}
          do
              mv ${file} doc
              git restore --staged ${file}
              echo "updated ${file}"
          done

          # update history in README_doc.md
          echo "1. Updated $(date) from branch [$config-branch-name](https://github.com/ACCESS-NRI/access-om3-configs/tree/$config-branch-name) commit [${commit}](https://github.com/ACCESS-NRI/access-om3-configs/tree/${commit})" >> doc/README_doc.md

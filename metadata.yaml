description: |-
    Prototype 4km ACCESS-OM3 pan-Antarctic configuration with ice shelves under
    interannual forcing.
    Initial conditions of temperature and salinity are interp/extrapolated from
    start of Jan of second year of ACCESS-OM2-01-RYF output, restarted from WOA13.
    Run with JRA55-do v1.6.0 interannually-varying forcing, starting 1 Jan 1975.
    Open boundary conditions at 37.5S are daily output from the second year of
    ACCESS-OM2-01-RYF, restarted from WOA13, repeated every year.

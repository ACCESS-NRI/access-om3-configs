description: |-
    A small regional configuration of ACCESS-rOM3 around Tasmania. This is not a science configuration but rather a template for other regional models, and is used by the regional-mom6 demo notebook https://github.com/COSIMA/regional-mom6/blob/main/demos/ACCESS-rOM3-demo.ipynb. 
    This template also serves as a place to test OM3 code changes and ensure they still work with a `regional-mom6` generated domain.

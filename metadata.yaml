description: |-
    100km ACCESS-OM3 global configuration coupling MOM6, CICE6 and
    WAVEWATCH III (MCW) under interannual forcing (IAF).
    Initial conditions of temperature and salinity are from WOA23.
    Run with hourly ERA5 atmospheric data, linearly interpolated to
    the half-hourly coupling times, and JRA55-do v1.6.0
    river and land-ice runoff. The simulation starts on 1 Jan 1958
    using the Gregorian calendar.
    Wave coupling supplies Stokes drift to MOM6 for Langmuir mixing
    and wave spectra to CICE6 for floe-size-distribution evolution.

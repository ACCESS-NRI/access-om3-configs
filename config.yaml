# Payu configuration

# If submitting to a different project to your default, uncomment line below 
# and change project code as appropriate; also set shortpath below
# project: x77
# Force payu to always find, and save, files in this scratch project directory
# shortpath: /scratch/v45

# Using payu sync is recommend to copy data from ephemeral scratch space to 
# longer term storage
sync:
    enable: False   # set path below and change to true
    base_path: null # Set to location on /g/data (e.g. /g/data/PROJECT/USER/)
    restarts: True
    exclude_uncollated: False

#Model software version
modules:
    use:
        - /g/data/vk83/modules
    load:
        - access-om3/2026.05.002
        - model-tools/mppnccombine-fast/2025.07.000

queue: normalsr
ncpus: 4160
jobfs: 10GB
mem: 13000GB
walltime: 6:00:00
jobname: superaus

model: access-om3
exe: access-om3-MOM6
input:
    - /g/data/vk83/configurations/inputs/access-om3/share/meshes/share/2026.01.21/JRA55do-datm-ESMFmesh.nc
    - /g/data/vk83/configurations/inputs/access-om3/share/meshes/share/2026.01.21/JRA55do-drof-ESMFmesh.nc
    - /g/data/tm70/hm6113/superaus/expt07_alltidesbathydeep/newfiles/access-rom3-ESMFmesh.nc
    - /g/data/tm70/hm6113/superaus/expt07_alltidesbathydeep/newfiles/access-rom3-nomask-ESMFmesh.nc
    - /g/data/tm70/hm6113/superaus/expt8/newfiles/topog.nc
    - /g/data/tm70/hm6113/superaus/expt8/ocean_hgrid.nc
    - /g/data/tm70/hm6113/superaus/expt8/ocean_vgrid.nc
    - /g/data/tm70/hm6113/superaus/expt8/init_tracers.nc
    - /g/data/tm70/hm6113/superaus/expt8/init_eta.nc
    - /g/data/tm70/hm6113/superaus/expt8/init_vel.nc
    - /g/data/tm70/hm6113/superaus/expt8/long/forcing_obc_segment_001.nc
    - /g/data/tm70/hm6113/superaus/expt8/long/forcing_obc_segment_002.nc
    - /g/data/tm70/hm6113/superaus/expt8/long/forcing_obc_segment_003.nc
    - /g/data/tm70/hm6113/superaus/expt8/long/forcing_obc_segment_004.nc
    - /g/data/tm70/hm6113/superaus/expt8/tu_segment_001.nc
    - /g/data/tm70/hm6113/superaus/expt8/tu_segment_002.nc
    - /g/data/tm70/hm6113/superaus/expt8/tu_segment_003.nc
    - /g/data/tm70/hm6113/superaus/expt8/tu_segment_004.nc
    - /g/data/tm70/hm6113/superaus/expt8/tz_segment_001.nc
    - /g/data/tm70/hm6113/superaus/expt8/tz_segment_002.nc
    - /g/data/tm70/hm6113/superaus/expt8/tz_segment_003.nc
    - /g/data/tm70/hm6113/superaus/expt8/tz_segment_004.nc
    - /g/data/tm70/hm6113/superaus/expt8/newfiles/access-rom3-5kmsuperoz-rof-remap-weights.nc
    - /g/data/qv56/replicas/input4MIPs/CMIP6Plus/OMIP/MRI/MRI-JRA55-do-1-6-0/land/
    - /g/data/qv56/replicas/input4MIPs/CMIP6Plus/OMIP/MRI/MRI-JRA55-do-1-6-0/landIce/
    - /g/data/qv56/replicas/input4MIPs/CMIP6Plus/OMIP/MRI/MRI-JRA55-do-1-6-0/atmos/

runlog: true
metadata: 
    enable: true
manifest:
  reproduce:
    exe: False
    input: False

mpi:
  flags:
  - --mca mpi_yield_when_idle true

collate:
  restart: true
  mpi: true
  walltime: 4:00:00
  mem: 30GB
  ncpus: 4
  queue: normalsr
  exe: mppnccombine-fast

userscripts:
    archive: /usr/bin/bash /g/data/vk83/apps/om3-scripts/payu_config/archive.sh

postscript: -v PROJECT,SCRIPTS_DIR=/g/data/vk83/apps/om3-scripts -lstorage=${PBS_NCI_STORAGE}+gdata/xp65 /g/data/vk83/apps/om3-scripts/payu_config/postscript.sh

qsub_flags: -W umask=027

restart_freq: 1
payu_minimum_version: 1.3.2

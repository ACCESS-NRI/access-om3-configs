# Payu configuration

# If submitting to a different project to your default, uncomment line below 
# and change project code as appropriate; also set shortpath below
# project: x77
# Force payu to always find, and save, files in this scratch project directory
# shortpath: /scratch/tm70

# Using payu sync is recommend to copy data from ephemeral scratch space to 
# longer term storage
sync:
    enable: False   # set path below and change to true
    base_path: null # Set to location on /g/data (e.g. /g/data/PROJECT/USER/)
    restarts: True
    exclude_uncollated: False

#Model software version
modules:
    use:
        - /g/data/vk83/modules
    load:
        - access-om3/2026.05.003
        - model-tools/mppnccombine-fast/2025.07.000

queue: normalsr
ncpus: 4944
jobfs: 10GB
#mem: 8000GB
walltime: 05:00:00
jobname: 8km_jra_ryf

model: access-om3
exe: access-om3-MOM6-CICE6
input:
  - /g/data/vk83/prerelease/configurations/inputs/access-om3/cice/grids/global.8km/2026.09.10/kmt.nc
  - /g/data/vk83/prerelease/configurations/inputs/access-om3/share/grids/global.8km/2026.09.08/ocean_hgrid.nc
  - /g/data/tm70/ek4684/8km_grid_input_files/cgrid_topography_main/ocean_vgrid.nc
  - /g/data/vk83/prerelease/configurations/inputs/access-om3/share/grids/global.8km/2026.09.10/topog.nc
  - /g/data/vk83/prerelease/configurations/inputs/access-om3/share/meshes/global.8km/2026.09.10/access-om3-8km-ESMFmesh.nc
  - /g/data/vk83/prerelease/configurations/inputs/access-om3/share/meshes/global.8km/2026.09.10/access-om3-8km-nomask-ESMFmesh.nc
  - /g/data/vk83/prerelease/configurations/inputs/access-om3/cmeps/remap_weights/global.8km/2026.09.10/access-om3-8km-rof-remap-weights.nc
  - /g/data/vk83/prerelease/configurations/inputs/access-om3/share/meshes/share/2026.01.21/JRA55do-datm-ESMFmesh.nc
  - /g/data/vk83/prerelease/configurations/inputs/access-om3/share/meshes/share/2026.01.21/JRA55do-drof-ESMFmesh.nc
  - /g/data/tm70/cyb561/8km_woa_ic/woa23_ts_01_mom.nc
  - /g/data/tm70/ek4684/8km_grid_input_files/cgrid_topography_main/salt_sfc_restore.nc
  - /g/data/vk83/prerelease/configurations/inputs/access-om3/mom/tidal_external_files/global.8km/2026.09.10/bottom_roughness.nc
  - /g/data/tm70/ek4684/8km_grid_input_files/cgrid_topography_main/chl_globcolour_monthly_clim.nc
  - /g/data/vk83/prerelease/configurations/inputs/access-om3/cmeps/rofi_pattern/global.8km/2026.09.10/access-om3-8km-rofi-climatology.nc
  - /g/data/vk83/prerelease/configurations/inputs/access-om3/mom/tidal_external_files/global.8km/2026.09.10/tideamp.nc
  - /g/data/vk83/configurations/inputs/JRA-55/RYF/v1-6/2026.04.15

runlog: true
metadata: 
    enable: true
manifest:
  reproduce:
    exe: True
    input: True

mpi:
  flags:
  - --mca mpi_yield_when_idle true

collate:
  restart: true
  mpi: true
  walltime: 4:00:00
  mem: 30GB
  ncpus: 4
  queue: normalsr
  exe: mppnccombine-fast

userscripts:
    archive: /usr/bin/bash /g/data/vk83/apps/om3-scripts/payu_config/archive.sh

postscript: -v PROJECT,SCRIPTS_DIR=/g/data/vk83/apps/om3-scripts -lstorage=${PBS_NCI_STORAGE}+gdata/xp65 /g/data/vk83/apps/om3-scripts/payu_config/postscript.sh

qsub_flags: -W umask=027

restart_freq: 1YS
payu_minimum_version: 1.3.6

# Payu configuration

# If submitting to a different project to your default, uncomment line below 
# and change project code as appropriate; also set shortpath below
# project: x77
# Force payu to always find, and save, files in this scratch project directory
# shortpath: /scratch/v45

# Using payu sync is recommend to copy data from ephemeral scratch space to 
# longer term storage
sync:
    enable: False   # set path below and change to true
    base_path: null # Set to location on /g/data (e.g. /g/data/PROJECT/USER/)
    restarts: True
    exclude_uncollated: False

#Model software version
modules:
    use:
        - /g/data/vk83/modules
    load:
        - access-om3/2026.05.003

queue: normalsr
ncpus: 936
jobfs: 10GB
mem: 4500GB

walltime: 03:00:00
jobname: MCW_25_100

model: access-om3

exe: access-om3-MOM6-CICE6-WW3
input:
    - /g/data/vk83/prerelease/configurations/inputs/access-om3/share/meshes/global.25km/2026.08.17/access-om3-25km-ESMFmesh.nc
    # WW3 runs on the 100 km grid: mesh_wav in nuopc.runconfig points here.
    - /g/data/vk83/prerelease/configurations/inputs/access-om3/share/meshes/global.100km/2026.04.07/access-om3-100km-ESMFmesh.nc
    - /g/data/vk83/configurations/inputs/access-om3/share/meshes/global.25km/2026.06.11/access-om3-25km-nomask-ESMFmesh.nc
    - /g/data/vk83/prerelease/configurations/inputs/access-om3/share/meshes/share/2026.07.30/ERA5-datm-ESMFmesh.nc
    - /g/data/vk83/configurations/inputs/access-om3/share/meshes/share/2026.01.21/JRA55do-drof-ESMFmesh.nc
    - /g/data/vk83/prerelease/configurations/inputs/access-om3/cmeps/remap_weights/global.25km/2026.08.18/access-om3-25km-rof-remap-weights.nc
    - /g/data/vk83/prerelease/configurations/inputs/access-om3/cmeps/rofi_pattern/global.25km/2026.08.18/access-om3-25km-rofi-climatology.nc
    - /g/data/vk83/prerelease/configurations/inputs/access-om3/mom/tidal_external_files/global.25km/2026.08.18/bottom_roughness.nc
    - /g/data/vk83/prerelease/configurations/inputs/access-om3/mom/tidal_external_files/global.25km/2026.08.18/tideamp.nc
    - /g/data/vk83/prerelease/configurations/inputs/access-om3/share/grids/global.25km/2026.08.17/topog.nc
    - /g/data/vk83/configurations/inputs/access-om3/share/grids/global.25km/2026.06.11/ocean_hgrid.nc
    - /g/data/vk83/configurations/inputs/access-om3/mom/grids/vertical/global.25km/2026.03.16/ocean_vgrid.nc
    - /g/data/vk83/configurations/inputs/access-om3/mom/initial_conditions/global.25km/2026.06.11/woa23_ts_01_mom.nc
    - /g/data/vk83/configurations/inputs/access-om3/mom/surface_salt_restoring/global.25km/2026.06.12/salt_sfc_restore.nc
    - /g/data/vk83/configurations/inputs/access-om3/mom/chlorophyll/global.25km/2026.06.11/chl_globcolour_monthly_clim.nc
    - /g/data/vk83/prerelease/configurations/inputs/access-om3/cice/grids/global.25km/2026.08.17/kmt.nc
    - /g/data/ps29/nd0349/access-om3/configurations/mcw/MCW_25km_100km_era_iaf/auxiliary_input/mask_table.176.29x28
    - /g/data/ps29/nd0349/access-om3/configurations/mcw/MCW_25km_100km_era_iaf/auxiliary_input/channel_list
    - /g/data/vk83/prerelease/configurations/inputs/access-om3/ww3/initial_conditions/global.100km/2026.08.10/restart.ww3
    - /g/data/ps29/nd0349/access-om3/configurations/mcw/MCW_25km_100km_era_iaf/WW3_PreProc/mod_def.ww3
    - /g/data/qv56/replicas/input4MIPs/CMIP6Plus/OMIP/MRI/MRI-JRA55-do-1-6-0/land/
    - /g/data/qv56/replicas/input4MIPs/CMIP6Plus/OMIP/MRI/MRI-JRA55-do-1-6-0/landIce/
    - /g/data/av17/access-nri/OM3/era5_rechunked_1h_yearly/

collate: false
runlog: false
metadata: 
    enable: false
manifest:
  reproduce:
    exe: false
    input: false

# normalsr: 16 nodes = 1664 cores. Cost-optimised: OCN is idle ~70% of the
# time waiting on CICE (measured), so ocn_ntasks was cut 2429 -> 1200 with no
# wall-time penalty (AUTO_MASKTABLE regenerates its own mask table for 1200
# at init). ice_ntasks stays at 275: 275->600 measured only 1.11x speedup for
# 2.18x cores (CICE block granularity: 2064 blocks / 600 PEs = 3.4/PE), so
# growing ICE further raises SU without a matching wall-time gain. restart_n
# raised 5 -> 25 ndays: measured restart write ~108s vs ~46s normal day, was
# 26% of the run loop for no science benefit at this cadence.
platform:
    nodesize: 104
    nodemem: 512

mpi:
  flags:
  - --mca mpi_yield_when_idle true

userscripts:
    archive: /usr/bin/bash /g/data/vk83/apps/om3-scripts/payu_config/archive.sh

postscript: -v PROJECT,SCRIPTS_DIR=/g/data/vk83/apps/om3-scripts -lstorage=${PBS_NCI_STORAGE}+gdata/xp65 /g/data/vk83/apps/om3-scripts/payu_config/postscript.sh

qsub_flags: -W umask=027

env:
    ESMF_RUNTIME_PROFILE: "on"
    ESMF_RUNTIME_PROFILE_OUTPUT: "SUMMARY"

restart_freq: 1YS
payu_minimum_version: 1.3.0
